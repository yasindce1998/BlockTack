# Historical incident replay: KyberSwap Elastic exploit — Arbitrum One
# component (2023-11-22, ~$47M multi-chain; the largest single-chain
# chunk, ~$20M+ on Arbitrum).
#
# Forks Arbitrum One at block 153081940 (8 blocks before the attacker's
# deployment; EOA at nonce 0 with its historical 2 ETH balance) and
# re-broadcasts the attacker's 12 signed historical transactions:
# 2 attack-contract deployments + 10 attack batches against KyberSwap
# Elastic concentrated-liquidity pools (tick rounding bug, BTV-L2-011).
# Zero transactions ever touch Arbitrum One.
#
# The replay is slow on a cold fork cache: the first execution of each
# attack batch lazily fetches archive state (~4,100 RPC calls total;
# single txs up to ~15 min). corpus/kyberswap-arbitrum-2023/rpc_proxy.py
# paces and disk-caches those fetches (rpc_cache/, gitignored), so warm
# reruns are fast. Full divergence analysis (single-actor replay vs the
# on-chain record, ~130 excluded competing arb txs) in
# corpus/kyberswap-arbitrum-2023/README.md.
#
# Run from the repo root (requires foundry):
#   bin/blocktack campaign \
#     --target corpus/kyberswap-arbitrum-2023/target.yaml \
#     --playbook playbooks/evm/kyberswap-arbitrum-incident-replay.yaml
apiVersion: blocktack/v1
kind: Playbook
name: kyberswap-arbitrum-incident-replay
description: >
  Replays the Arbitrum One component of the KyberSwap Elastic exploit
  (BTV-L2-011, concentrated-liquidity tick math): the attacker's
  12 transactions (2 deploys + 10 attack batches) re-execute
  deterministically and the 15-token profit materializes on the
  profit-holder account. The five largest profit tokens are verified
  with thresholds; the full 15-token parity against the on-chain record
  (13/15 exact to the raw unit; WETH/WBTC slightly above the record
  because ~130 competing arbitrage transactions are excluded from
  single-actor replay) is documented in
  corpus/kyberswap-arbitrum-2023/.
target:
  chainTypes: [evm]
  layers: [L2]
steps:
  - id: env-up-proxy
    name: Start the pacing/caching fork proxy for Arbitrum archive state
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          python3 corpus/kyberswap-arbitrum-2023/rpc_proxy.py 8559 \
            "${FORK_UPSTREAM:-https://arbitrum-one-public.nodies.app}"
      background: true

  - id: wait-for-proxy
    name: Wait for the fork proxy to accept requests
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8559 && exit 0
            sleep 1
          done
          echo "fork proxy did not come up" >&2
          exit 1

  - id: env-up
    name: Fork Arbitrum One at the pre-deployment block
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          anvil --fork-url "${FORK_URL:-http://127.0.0.1:8559}" \
            --fork-block-number 153081940 --port 8558
      background: true

  - id: wait-for-rpc
    name: Wait for the fork to accept requests
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          for i in $(seq 1 120); do
            cast block-number --rpc-url http://127.0.0.1:8558 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "anvil fork did not come up" >&2
          exit 1

  - id: identify-chain
    name: Fingerprint the fork
    tactic: discover
    run:
      type: engine
      engine: blocktack-evm
      action: fingerprint

  - id: arb-before
    name: Record profit-holder ARB balance before the replay
    tactic: discover
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0x912CE59144191C1204E64559FE8253a0e49E6548" # ARB
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]

  - id: replay-transactions
    name: Re-broadcast the attacker's 12 signed transactions in order
    tactic: exploit
    precondition: fork block 153081940 — attacker EOA at nonce 0 so the historical deployments and attacks execute identically
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - "corpus/kyberswap-arbitrum-2023/replay.sh"

  - id: verify-arb-profit
    name: Verify ARB profit (largest component, ~3.99M ARB)
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0x912CE59144191C1204E64559FE8253a0e49E6548" # ARB
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "3800000000000000000000000" # 3,800,000 ARB (on-chain record: 3,987,331.66)

  - id: verify-dai-profit
    name: Verify DAI profit (~826.5k DAI)
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0xDA10009cBd5D07dd0CeCc66161FC93D7c9000da1" # DAI
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "780000000000000000000000" # 780,000 DAI (on-chain record: 826,527.82)

  - id: verify-knc-profit
    name: Verify KNC profit (~368k KNC)
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0xe4dddfe67e7164b0fe14e218d80dc4c08edc01cb" # KNC
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "350000000000000000000000" # 350,000 KNC (on-chain record: 368,092.88)

  - id: verify-weth-profit
    name: Verify WETH profit (~5,524 WETH; slightly above the record due to excluded competing arbs)
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0x82aF49447D8a07e3bd95BD0d56f35241523Fbab1" # WETH
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "5300000000000000000000" # 5,300 WETH (on-chain record: 5,524.17; fork retains the competing-arb slice)

  - id: verify-axlusdc-profit
    name: Verify axlUSDC profit (~396.4k axlUSDC)
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0xEB466342C4d449BC9f53a865d5Cb90586f405215" # axlUSDC
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "380000000000" # 380,000 axlUSDC (6 decimals; on-chain record: 396,445.43)

  - id: verify-replay-gate
    name: Hard gate — all 12 receipts status=1 and all 5 token thresholds met
    tactic: verify
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          python3 - <<'PYEOF'
          import json, urllib.request, glob, os, sys
          RPC = "http://127.0.0.1:8558"
          def rpc(method, params):
              req = urllib.request.Request(RPC, data=json.dumps(
                  {"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode(),
                  headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60)).get("result")
          fail = 0
          print("== replay receipts ==")
          for f in sorted(glob.glob("corpus/kyberswap-arbitrum-2023/transactions/*.raw")):
              b = os.path.basename(f)
              txhash = b.split("_", 1)[1][:-4]  # "NN_" prefix and ".raw" suffix stripped; "0x..." kept
              rec = rpc("eth_getTransactionReceipt", [txhash])
              st = rec["status"] if rec else "missing"
              print(f"  {st}  {txhash}")
              if st != "0x1":
                  fail = 1
          HOLDER = "0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"
          def balance(token):
              data = "0x70a08231" + "0"*24 + HOLDER[2:]
              return int(rpc("eth_call", [{"to": token, "data": data}, "latest"]), 16)
          gates = [
              ("0x912CE59144191C1204E64559FE8253a0e49E6548", "ARB",     3800000000000000000000000),
              ("0xDA10009cBd5D07dd0CeCc66161FC93D7c9000da1", "DAI",     780000000000000000000000),
              ("0xe4dddfe67e7164b0fe14e218d80dc4c08edc01cb", "KNC",     350000000000000000000000),
              ("0x82aF49447D8a07e3bd95BD0d56f35241523Fbab1", "WETH",    5300000000000000000000),
              ("0xEB466342C4d449BC9f53a865d5Cb90586f405215", "axlUSDC", 380000000000),
          ]
          print("== profit-holder token gates ==")
          for token, name, minimum in gates:
              b = balance(token)
              ok = b >= minimum
              print(f"  {name:<8} {b:>45d}  {'OK' if ok else 'BELOW minimum ' + str(minimum)}")
              if not ok:
                  fail = 1
          sys.exit(fail)
          PYEOF

verification:
  - id: transactions-executed
    expects: all 12 vendored raw transactions mine with status=1 on the fork, identical hashes to Arbitrum One
  - id: profit-materialized
    expects: five critical findings — ARB/DAI/KNC/WETH/axlUSDC thresholds met on the profit holder, enforced by the verify-replay-gate step
  - id: matches-history
    expects: 13/15 token balances match the on-chain record to the raw unit; WETH/WBTC slightly above the record because ~130 competing arbitrage transactions are excluded from single-actor replay (evidence in corpus/kyberswap-arbitrum-2023/)
