# Historical incident replay: KyberSwap Elastic exploit (2023-11-22,
# ~$47M multi-chain; ~$7.5M on mainnet).
#
# Forks mainnet at block 18630389 (attacker EOA's funding/bridging
# nonces 0-6 already spent) and re-broadcasts the attacker's 4 signed
# historical transactions: contract deploy + three attacks against a
# dozen KyberSwap Elastic pools (concentrated-liquidity tick rounding
# bug, BTV-L2-011). Zero transactions ever touch mainnet.
#
# Run from the repo root (requires foundry; archive-capable fork RPC —
# override with FORK_URL if the default is rate-limited):
#   bin/blocktack campaign \
#     --target corpus/kyberswap-2023/target.yaml \
#     --playbook playbooks/evm/kyberswap-incident-replay.yaml
apiVersion: blocktack/v1
kind: Playbook
name: kyberswap-incident-replay
description: >
  Replays the Ethereum mainnet component of the KyberSwap Elastic
  exploit (BTV-L2-011, concentrated-liquidity math): the attacker's
  deploy + 3 attack transactions re-execute deterministically and the
  11-token profit materializes on the profit-holder account. The four
  largest profit tokens are verified with thresholds; the full 11-token
  mainnet parity is documented in corpus/kyberswap-2023/.
target:
  chainTypes: [evm]
  layers: [L2]
steps:
  - id: env-up
    name: Fork mainnet at the pre-deployment block
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          anvil --fork-url "${FORK_URL:-https://eth.drpc.org}" \
            --fork-block-number 18630389 --port 8545
      background: true

  - id: wait-for-rpc
    name: Wait for the fork to accept requests
    tactic: setup
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          for i in $(seq 1 100); do
            cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "anvil fork did not come up" >&2
          exit 1

  - id: identify-chain
    name: Fingerprint the fork
    tactic: discover
    run:
      type: engine
      engine: blocktack-evm
      action: fingerprint

  - id: weth-before
    name: Record profit-holder WETH balance before the replay
    tactic: discover
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2" # WETH
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]

  - id: replay-transactions
    name: Re-broadcast the attacker's 4 signed transactions in order
    tactic: exploit
    precondition: fork block 18630389 — attacker EOA at nonce 7 so the historical deployment and attacks execute identically
    run:
      type: shell
      command: sh
      args:
        - "-c"
        - |
          set -e
          for f in corpus/kyberswap-2023/transactions/*.raw; do
            name="$(basename "$f")"
            raw="$(tr -d '[:space:]' < "$f")"
            echo "publishing $name"
            cast publish --rpc-url http://127.0.0.1:8545 "$raw"
          done
          echo "all transactions published"

  - id: verify-weth-profit
    name: Verify WETH profit (largest component)
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2" # WETH
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "3000000000000000000000" # 3,000 WETH (actual: 3,297.14)

  - id: verify-usdc-profit
    name: Verify USDC profit
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" # USDC
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "70000000000" # 70,000 USDC (actual: 72,978.53)

  - id: verify-frax-profit
    name: Verify FRAX profit
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0x853d955aCEf822Db058eb8505911ED77F175b99e" # FRAX
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "25000000000000000000000" # 25,000 FRAX (actual: 25,440.86)

  - id: verify-knc-profit
    name: Verify KNC profit
    tactic: verify
    run:
      type: engine
      engine: blocktack-evm
      action: erc20-balance
      options:
        token: "0xdefa4e8a7bcba345f687a2f1456f5edd9ce97202" # KNC
        accounts: ["0xc9b826bad20872eb29f9b1d8af4befe8460b50c6"]
        minProfit: "600000000000000000000000" # 600,000 KNC (actual: 640,340.75)

verification:
  - id: transactions-executed
    expects: all 4 vendored raw transactions publish with status=1 on the fork
  - id: profit-materialized
    expects: four critical findings — WETH/USDC/FRAX/KNC thresholds met on the profit holder
  - id: matches-history
    expects: all 11 token balances match the mainnet record to the wei (documented in corpus/kyberswap-2023/)
