# BlockTack known-exploits regression corpus.
#
# Every entry is a real incident that BlockTack should eventually detect,
# reproduce, or simulate. The goal metric for the platform is simple:
# how many of these can a campaign replay end to end on a forked chain?
#
# status:
#   pending    — not yet covered
#   detected   — tooling flags the weakness class on the replayed target
#   reproduced — a playbook executes the exploit end to end with verified PnL
apiVersion: blocktack/corpus/v1
exploits:  - id: ronin-bridge-2022
    title: Ronin Bridge validator key compromise
    year: 2022
    layers: [L3]
    weakness: BTV-L3-002
    reference: https://rekt.news/ronin-rekt/
    status: pending
    notes: 5 of 9 validator keys compromised via social engineering and compromised nodes

  - id: wormhole-2022
