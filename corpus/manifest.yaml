# BlockTack known-exploits regression corpus.
#
# Every entry is a real incident that BlockTack should eventually detect,
# reproduce, or simulate. The goal metric for the platform is simple:
# how many of these can a campaign replay end to end on a forked chain?
#
# status:
#   pending    — not yet covered
#   detected   — tooling flags the weakness class on the replayed target
#   reproduced — a playbook executes the exploit end to end with verified PnL
apiVersion: blocktack/corpus/v1
exploits:  - id: ronin-bridge-2022
    title: Ronin Bridge validator key compromise
    year: 2022
    layers: [L3]
    weakness: BTV-L3-002
    reference: https://rekt.news/ronin-rekt/
    status: pending
    notes: 5 of 9 validator keys compromised via social engineering and compromised nodes

  - id: wormhole-2022
    title: Wormhole signature verification flaw
    year: 2022
    layers: [L3]
    weakness: BTV-L3-001
    reference: https://rekt.news/wormhole-rekt/
    status: pending
    notes: fake guardian set spoofed into the bridge

  - id: harmony-bridge-2022
    title: Horizon Bridge multisig compromise
    year: 2022
    layers: [L3]
    weakness: BTV-L3-002
    reference: https://rekt.news/harmony-rekt/
    status: pending
    notes: 2-of-5 multisig keys stolen

  - id: bnb-bridge-2022
    title: BNB Bridge IAVL proof forgery
    year: 2022
    layers: [L3]
    weakness: BTV-L3-004
    reference: https://rekt.news/bnb-bridge-rekt/
    status: pending
    notes: forged proof minted precompile tokens

  - id: mango-markets-2022
    title: Mango Markets oracle price manipulation
    year: 2022
    layers: [L2, L5]
    weakness: BTV-L2-003
    reference: https://rekt.news/mango-rekt/
    status: pending
    notes: on-chain oracle pumped with attacker's own holdings; Solana target

  - id: euler-2023
    title: Euler Finance donate/flash-loan exploit
    year: 2023
    layers: [L2]
    weakness: BTV-L2-006
    reference: https://rekt.news/euler-rekt/
    status: reproduced
    notes: >-
      First historical incident replayed by raw-transaction rebroadcast on
      a mainnet fork (block 16817992): the attacker's 15 signed
      transactions re-execute deterministically, materializing ~43M DAI +
      ~8k ETH across the attack contracts and EOA — within 0.1% of the
      on-chain record. See corpus/euler-2023/.

  - id: curve-vyper-2023
    title: Curve Vyper reentrancy (compiler bug)
    year: 2023
    layers: [L2]
    weakness: BTV-L2-012
    reference: https://rekt.news/curve-vyper-rekt/
    status: reproduced
    notes: >-
      Historical incident replayed by raw-transaction rebroadcast on a
      mainnet fork (block 17806055): the original attacker's 3-tx drain
      of the JPEG'd pETH/ETH pool (Vyper 0.2.15 broken reentrancy locks)
      re-executes with gasUsed matching mainnet exactly, netting
      6,106.751307562450092427 WETH — exact to the wei. See
      corpus/curve-vyper-2023/.

  - id: multichain-2023
    title: Multichain key management failure
    year: 2023
    layers: [L4]
    weakness: BTV-L4-004
    reference: https://rekt.news/multichain-rekt/
    status: pending
    notes: MPC keys controlled by a single person

  - id: kyberswap-2023
    title: KyberSwap Elastic liquidity math exploit
    year: 2023
    layers: [L2]
    weakness: BTV-L2-011
    reference: https://rekt.news/kyberswap-rekt/
    status: reproduced
    notes: >-
      Historical incident replayed by raw-transaction rebroadcast on a
      mainnet fork (block 18630389): the Ethereum mainnet component
      (~$7.5M) — deploy + 3 attack transactions against a dozen Elastic
      pools — re-executes with zero divergence, all 11 profit-token
      balances of the profit holder matching mainnet to the wei. The
      ~$40M on other chains is out of scope. See corpus/kyberswap-2023/.

  - id: kyberswap-arbitrum-2023
    title: KyberSwap Elastic liquidity math exploit (Arbitrum One)
    year: 2023
    layers: [L2]
    weakness: BTV-L2-011
    reference: https://rekt.news/kyberswap-rekt/
    status: reproduced
    notes: >-
      Historical incident replayed by raw-transaction rebroadcast on an
      Arbitrum One fork (block 153081940): the largest single-chain
      chunk (~$20M+) — 12 attacker transactions (2 deploys + 10 attack
      batches) re-execute with status=1 and identical hashes; 13/15
      profit tokens match the on-chain record to the raw unit, WETH/
      WBTC slightly above it because ~130 competing arbitrage txs are
      excluded from single-actor replay (evidence in
      corpus/kyberswap-arbitrum-2023/). The ~$7.5M Ethereum mainnet
      component is covered by the kyberswap-2023 entry. Validated
      end-to-end twice (2026-11-14); WETH varies ~±1 WETH between runs
      because automine block timestamps differ from the historical ones
      (Elastic fee math is timestamp-sensitive).

  - id: radiant-2024
    title: Radiant Capital signer compromise
    year: 2024
    layers: [L4]
    weakness: BTV-L4-004
    reference: https://rekt.news/radiant-rekt-2/
    status: pending
    notes: malware on signer machines; malicious transactions signed blind

  - id: bybit-2025
    title: Bybit Safe frontend/signer compromise
    year: 2025
    layers: [L4]
    weakness: BTV-L4-002
    reference: https://rekt.news/bybit-rekt/
    status: pending
    notes: compromised signing UI showed benign data while signing malicious transactions

  - id: cetus-2025
    title: Cetus Protocol integer overflow (Solana)
    year: 2025
    layers: [L2]
    weakness: BTV-L2-004
    reference: https://rekt.news/cetus-rekt/
    status: pending
    notes: checked_math bypass in liquidity math; non-EVM target

# Wargame corpus entries — real-world-shaped vulnerabilities from
# https://damnvulnerabledefi.xyz, vendored (trimmed) under
# corpus/damn-vulnerable-defi/ with solutions written as test_poc_*.
# Replayed by playbooks/evm/damn-vulnerable-defi.yaml.
wargames:
  - id: dvd-side-entrance
    title: Damn Vulnerable DeFi — Side Entrance
    layers: [L2]
    weakness: BTV-L2-001
    reference: https://damnvulnerabledefi.xyz/challenges/side-entrance/
    status: reproduced
    notes: flash loan "repaid" via the pool's own deposit(); balance accounting flaw credits the attacker a withdrawable balance

  - id: dvd-naive-receiver
    title: Damn Vulnerable DeFi — Naive Receiver
    layers: [L2]
    weakness: BTV-L2-002
    reference: https://damnvulnerabledefi.xyz/challenges/naive-receiver/
    status: reproduced
    notes: fixed flash-loan fee drains the receiver; _msgSender() trusts calldata suffixes so a delegatecall through Multicall forges the depositor and empties the pool

  - id: dvd-puppet-v2
    title: Damn Vulnerable DeFi — Puppet V2
    layers: [L2, L5]
    weakness: BTV-L2-003
    reference: https://damnvulnerabledefi.xyz/challenges/puppet-v2/
    status: reproduced
    notes: lending pool prices collateral from Uniswap V2 spot reserves; dumping tokens crashes the oracle and the pool is borrowed for a fraction of its value

  - id: dvd-compromised
    title: Damn Vulnerable DeFi — Compromised
    layers: [L2, L4]
    weakness: BTV-L2-003
    reference: https://damnvulnerabledefi.xyz/challenges/compromised/
    status: reproduced
    notes: two of three oracle sources' keys leaked (encoded in challenge docs); median price crashed to buy an NFT for 1 wei, then pumped to drain the exchange for 999 ETH

  - id: dvd-the-rewarder
    title: Damn Vulnerable DeFi — The Rewarder
    layers: [L2]
    weakness: BTV-L2-009
    reference: https://damnvulnerabledefi.xyz/challenges/the-rewarder/
    status: reproduced
    notes: distributor's double-claim bitmap latches once per contiguous claim run, so one valid Merkle claim replays ~1700 times in a single call, draining both DVT and WETH distributions to dust

  - id: dvd-free-rider
    title: Damn Vulnerable DeFi — Free Rider
    layers: [L2, L5]
    weakness: BTV-L5-003
    reference: https://damnvulnerabledefi.xyz/challenges/free-rider/
    status: reproduced
    notes: marketplace's buyMany pays once for all NFTs and refunds the price to the buyer (ownerOf checked after transfer); a Uniswap V2 flash swap supplies the 15 ETH stake — ~120 ETH extracted
