# Curve/Vyper mainnet-fork target for the 2023-07-30 incident replay.
# The playbook forks mainnet at block 17806055 (pre-attack) on a local
# anvil and re-broadcasts the attacker's signed historical transactions.
apiVersion: blocktack/v1
name: curve-vyper-2023-fork
chain:
  type: evm
  network: mainnet-fork
  chainId: 1
  fork:
    enabled: true
    base: https://eth.drpc.org
    blockNumber: 17806055
endpoints:
  - name: local-anvil-fork
    role: rpc
    url: http://127.0.0.1:8545
contracts:
  - name: curve-attack-contract
    address: "0x9420F8821aB4609Ad9FA514f8D2F5344C3c0A6Ab"
  - name: jpegd-peth-eth-pool
    address: "0x9848482da3ee3076165ce6497eda906e66bb85c5"
components:
  - name: curve-jpegd-peth-pool
    kind: node
    note: Curve stableswap pool compiled with Vyper 0.2.15 (broken reentrancy locks)
authorization:
  declared: true
  authorizedBy: self (local lab)
  scope: local forked environment only — read-only queries to public archive RPCs; transactions are broadcast only to the local fork
  expires: "2027-12-31T00:00:00Z"
