[package]
name = "blocktack-evm"
version = "0.1.0"
edition = "2021"
description = "BlockTack EVM attack engine: deep simulation and exploit execution against EVM chains"

[dependencies]
alloy = { version = "2.5.0", features = ["providers", "provider-http", "rpc-types"] }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
