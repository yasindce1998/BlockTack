<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BlockTack logo">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101830"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- banner plate -->
  <rect x="1.5" y="1.5" width="637" height="177" rx="28" fill="url(#plate)"/>
  <rect x="1.5" y="1.5" width="637" height="177" rx="28" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- mark (shared with logo-icon.svg, scaled to fit) -->
  <g transform="translate(-2,-28) scale(0.8)">
    <circle cx="150" cy="141" r="72" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="150" cy="141" r="72" fill="none" stroke="#67e8f9" stroke-width="4.5" stroke-linecap="round"
            stroke-dasharray="42 410" stroke-dashoffset="-175" opacity="0.95"/>
    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
      <line x1="150" y1="55" x2="150" y2="73"/>
      <line x1="150" y1="209" x2="150" y2="227"/>
      <line x1="64" y1="141" x2="82" y2="141"/>
      <line x1="218" y1="141" x2="236" y2="141"/>
    </g>
    <g opacity="0.30">
      <polygon points="56,88 82,103 56,118 30,103" fill="#22d3ee"/>
      <polygon points="30,103 56,118 56,148 30,133" fill="#3730a3"/>
      <polygon points="82,103 56,118 56,148 82,133" fill="#4338ca"/>
    </g>
    <g opacity="0.55">
      <polygon points="90,106 116,121 90,136 64,121" fill="#22d3ee"/>
      <polygon points="64,121 90,136 90,166 64,151" fill="#3730a3"/>
      <polygon points="116,121 90,136 90,166 116,151" fill="#4338ca"/>
    </g>
    <g>
      <polygon points="150,90 204,121 150,152 96,121" fill="url(#top)"/>
      <polygon points="96,121 150,152 150,212 96,181" fill="url(#left)"/>
      <polygon points="204,121 150,152 150,212 204,181" fill="url(#right)"/>
      <polygon points="150,90 204,121 150,152 96,121" fill="none" stroke="#a5f3fc" stroke-opacity="0.6" stroke-width="2"/>
      <line x1="150" y1="152" x2="150" y2="212" stroke="#c7d2fe" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <circle cx="150" cy="141" r="6" fill="#f8fafc"/>
    <circle cx="150" cy="141" r="13" fill="none" stroke="#f8fafc" stroke-opacity="0.9" stroke-width="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="196" y="90" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="800" letter-spacing="0.5" fill="#f8fafc">Block<tspan fill="url(#accent)">Tack</tspan></text>
  <text x="200" y="124" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="16.5" letter-spacing="1.1" fill="#94a3b8">END-TO-END ADVERSARY SIMULATION</text>
  <rect x="199" y="136" width="168" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
</svg>
